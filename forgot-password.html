<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ExpenseTrack</title>
    <meta name="description" content="Reset your ExpenseTrack password.">
    <!-- Favicon (SVG = crisp at any size, PNG fallback) -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-brand">
                    <div class="auth-logo">🔑</div>
                    <h1 class="auth-title">Forgot Password</h1>
                </div>
                <p class="auth-subtitle">Reset your ExpenseTrack password</p>
            </div>

            <!-- Notification Alert -->
            <div id="alert-msg" class="alert alert-danger hidden"></div>

            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px;">
                Enter your account email and we'll send you a secure password reset link.
            </p>

            <!-- Form -->
            <form id="forgot-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g. user@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full mt-3">Send Reset Link</button>
            </form>

            <div class="security-note">
                📧 <strong>How it works:</strong> We email you a secure one-time link. Open it within a few hours and set a new password.
            </div>

            <!-- Footer Link -->
            <div class="auth-footer-text mt-3">
                <a href="login.html" class="auth-link">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
