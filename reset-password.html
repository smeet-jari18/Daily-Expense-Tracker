<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ExpenseTrack</title>
    <meta name="description" content="Create a new password for your ExpenseTrack account.">
    <!-- Favicon (SVG = crisp at any size, PNG fallback) -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-brand">
                    <div class="auth-logo">🔐</div>
                    <h1 class="auth-title">Reset Password</h1>
                </div>
                <p class="auth-subtitle">Set a new password for your account</p>
            </div>

            <!-- Notification Alert -->
            <div id="alert-msg" class="alert alert-danger hidden"></div>

            <p id="reset-hint" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px;">
                Open the secure link from your reset email, then enter your new password below.
            </p>

            <!-- Form -->
            <form id="reset-form" novalidate>
                <div class="form-group">
                    <label for="new-password">New Password (min 6 chars)</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="new-password" placeholder="Enter new password" required>
                        <button type="button" class="password-toggle-btn" data-target="new-password" title="Show Password">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="confirm-password" placeholder="Confirm new password" required>
                        <button type="button" class="password-toggle-btn" data-target="confirm-password" title="Show Password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full mt-3">Reset Password</button>
            </form>

            <!-- Back to Login Button -->
            <div class="auth-footer-text mt-3">
                <a href="forgot-password.html" class="auth-link">Didn't get an email? Send a new one</a><br>
                <a href="login.html" class="auth-link">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
